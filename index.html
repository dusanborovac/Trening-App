<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gvozdeni dnevnik</title>
<meta name="description" content="Plan treninga, dnevnik kilaža i ponavljanja, težina, trener i saveti.">
<meta name="theme-color" content="#EDF0F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F11" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800&display=swap">
<style>

:root{
  color-scheme: light;
  --bg:#EDF0F1; --surface:#FFFFFF; --surface-2:#F3F5F6; --field:#F7F9F9;
  --line:#D6DDE0; --line-strong:#AEB9BE;
  --ink:#111518; --ink-2:#434E55; --ink-3:#62707A;
  --btn:#111518; --btn-ink:#FFFFFF;
  --link:#1D5BC2; --focus:#1D5BC2;
  --red:#D22F2A; --on-red:#FFFFFF;
  --blue:#1F5FC8; --on-blue:#FFFFFF;
  --yellow:#F2B705; --on-yellow:#231B00;
  --green:#1D8743; --on-green:#FFFFFF;
  --white:#FFFFFF; --on-white:#111518; --white-rim:#98A3A8;
  --good:#1D8743; --good-bg:#E2F1E7; --good-ink:#145E2F;
  --warn-bg:#FFF3CC; --warn-ink:#5A4300;
  --bad:#C22E2A; --bad-bg:#FBE6E5; --bad-ink:#8E1F1C;
  --grid:#E3E8EA; --series:#1F5FC8; --series-2:#8B969C; --band:rgba(29,135,67,.11); --band-ink:#145E2F;
  --shadow:0 1px 2px rgba(17,21,24,.05);
  --r:14px;
  --f-display:"Big Shoulders Display","Big Shoulders","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0B0F11; --surface:#141A1D; --surface-2:#192024; --field:#0F1417;
    --line:#263035; --line-strong:#3C4A50;
    --ink:#ECF1F2; --ink-2:#AEBAC0; --ink-3:#8794A0;
    --btn:#ECF1F2; --btn-ink:#0B0F11;
    --link:#86AAF2; --focus:#86AAF2;
    --red:#E04A43; --blue:#4D85E6; --yellow:#F2C230; --green:#2E9E57;
    --white:#E7ECEE; --on-white:#0B0F11; --white-rim:#E7ECEE;
    --good:#3DB46A; --good-bg:#12291B; --good-ink:#8FDDAA;
    --warn-bg:#342A08; --warn-ink:#F4D77A;
    --bad:#F0625C; --bad-bg:#34150F; --bad-ink:#FFB3AE;
    --grid:#20292D; --series:#6E9CEC; --series-2:#6F7C84; --band:rgba(46,158,87,.16); --band-ink:#8FDDAA;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0B0F11; --surface:#141A1D; --surface-2:#192024; --field:#0F1417;
  --line:#263035; --line-strong:#3C4A50;
  --ink:#ECF1F2; --ink-2:#AEBAC0; --ink-3:#8794A0;
  --btn:#ECF1F2; --btn-ink:#0B0F11;
  --link:#86AAF2; --focus:#86AAF2;
  --red:#E04A43; --blue:#4D85E6; --yellow:#F2C230; --green:#2E9E57;
  --white:#E7ECEE; --on-white:#0B0F11; --white-rim:#E7ECEE;
  --good:#3DB46A; --good-bg:#12291B; --good-ink:#8FDDAA;
  --warn-bg:#342A08; --warn-ink:#F4D77A;
  --bad:#F0625C; --bad-bg:#34150F; --bad-ink:#FFB3AE;
  --grid:#20292D; --series:#6E9CEC; --series-2:#6F7C84; --band:rgba(46,158,87,.16); --band-ink:#8FDDAA;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,a,input,select,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2,h3{text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:26px;height:26px;border-radius:50%;background:var(--ink);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.brand-name{font:800 25px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sync{appearance:none;border:0;background:none;padding:8px 0;cursor:pointer;font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.sync[data-s="local"]{color:var(--ink);font-weight:600}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.sync[data-s="cloud"]::before{background:var(--good)}
.sync[data-s="local"]::before{background:var(--yellow)}
.sync[data-s="error"]::before{background:var(--bad)}

.panel{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.h-panel{font:800 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:6px 0 0}
.h-sub{font:800 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:10px 0 0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.hint{margin:0;font-size:13px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-weight:600;min-height:52px;padding:0 18px;cursor:pointer;font-size:16.5px}
.btn[aria-busy="true"]{opacity:.6;cursor:progress}
.btn-block{width:100%}
.btn-2{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:10px;min-height:40px;padding:0 12px;font-weight:500;cursor:pointer;font-size:14.5px}
.btn-2.armed{border-color:var(--bad);color:var(--bad);font-weight:600}
.linkbtn{appearance:none;border:0;background:none;color:var(--link);padding:0;cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px}
body:has(.timer:not([hidden])) .app{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.note{border-radius:12px;padding:10px 12px;font-size:14.5px;background:var(--warn-bg);color:var(--warn-ink);margin:0}
.note.good{background:var(--good-bg);color:var(--good-ink)}
.note.plain{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.empty{color:var(--ink-3);font-size:14px;margin:6px 0}

/* plates: day badges in competition-plate colors */
.plate{--pc:var(--blue);--po:var(--on-blue);position:relative;display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--pc);color:var(--po);font:800 19px/1 var(--f-display)}
.plate::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px solid var(--po);opacity:.3}
.plate.two{font-size:15px}
.plate.lg{width:70px;height:70px;font-size:36px}
.plate.lg.two{font-size:27px}
.plate.lg::after{inset:5px;border-width:2px}
.p-red{--pc:var(--red);--po:var(--on-red)}
.p-blue{--pc:var(--blue);--po:var(--on-blue)}
.p-yellow{--pc:var(--yellow);--po:var(--on-yellow)}
.p-green{--pc:var(--green);--po:var(--on-green)}
.p-white{--pc:var(--white);--po:var(--on-white);box-shadow:inset 0 0 0 1.5px var(--white-rim)}

/* today */
.today{display:flex;gap:14px;align-items:center}
.day-title{font:800 42px/.95 var(--f-display);text-transform:uppercase;margin:3px 0 4px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.daychip{appearance:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:48px}
.daychip[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.daychip .plate{width:34px;height:34px;font-size:17px}
.daychip .plate.two{font-size:13px}
.dc-t{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.dc-n{font-weight:600;font-size:14px}
.dc-s{font-size:12px;color:var(--ink-3)}
.daychip.done .dc-s{color:var(--good-ink)}
.daychip.next .dc-s{color:var(--ink);font-weight:600}
.sel{width:100%;height:46px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--field);padding:0 10px;font-size:16px}
.sel-sm{width:auto;height:40px;font-size:15px}
.field label{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-bottom:4px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--field);padding:0 10px;font-size:16px}
.field input{height:46px}
.field textarea{padding:10px;min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus,.sel:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.date-row{display:flex;align-items:center;gap:10px}
.date-row label{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.date-row input{height:42px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--field);padding:0 10px;font-size:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* exercise cards */
.ex{display:flex;flex-direction:column;gap:9px}
.ex-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.ex-num{font:800 24px/1 var(--f-display);color:var(--ink-3);min-width:16px;padding-top:1px}
.ex-name{font-size:17px;font-weight:600;margin:0;line-height:1.25}
.ex-meta{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.yt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line-strong);border-radius:999px;padding:0 11px;white-space:nowrap;min-height:36px}
.yt svg{width:12px;height:12px;fill:var(--red)}
.ex-last{margin:0;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sugg{margin:0;font-size:15px;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.sugg b{font-weight:600}
.sugg .why{flex-basis:100%;font-size:13px;color:var(--ink-3)}
.tag{display:inline-block;background:var(--yellow);color:var(--on-yellow);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;line-height:1.5}
.warm{margin:0;font-size:13px;color:var(--ink-3)}
.sets{display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center}
.set-row.head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.set-row.head span:nth-child(2),.set-row.head span:nth-child(3){text-align:center}
.set-n{font:800 18px/1 var(--f-display);color:var(--ink-3);text-align:center}
.inp{width:100%;min-width:0;height:48px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--field);text-align:center;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;padding:0 6px}
.inp::placeholder{color:var(--ink-3);opacity:.7;font-weight:400}
.inp:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.inp[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 25%,transparent)}
.set-row.is-done .inp{border-color:color-mix(in srgb,var(--good) 60%,var(--line-strong));background:var(--good-bg)}
.kg-na{height:48px;display:grid;place-items:center;font-size:13px;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:10px}
.tick{appearance:none;width:50px;height:48px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-3);padding:0}
.tick svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.row-err{margin:0;font-size:13.5px;color:var(--bad)}
.ex-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini{appearance:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:0 12px;min-height:36px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
details.tech{flex-basis:100%;font-size:14px}
details.tech summary{cursor:pointer;color:var(--ink-2);font-weight:500;padding:4px 0;min-height:32px}
details.tech ul{margin:4px 0 8px;padding-left:18px}
details.tech li{margin-bottom:3px}
details.tech p{margin:0 0 6px}
.result{border:1.5px solid var(--good);background:var(--good-bg);color:var(--good-ink);border-radius:var(--r);padding:14px}
.result h3{margin:0;font:800 26px/1 var(--f-display);text-transform:uppercase}
.result p,.result ul{margin:6px 0 0}
.result ul{padding-left:18px}
.save-bar{display:flex;flex-direction:column;gap:8px}

/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:30;width:min(608px,calc(100% - 32px));background:var(--btn);color:var(--btn-ink);border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.timer.done{background:var(--good);color:#fff}
.t-main{flex:1;min-width:0}
.t-lab{font-size:12.5px;opacity:.85}
.t-time{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.t-bar{height:4px;border-radius:2px;background:color-mix(in srgb,currentColor 22%,transparent);margin-top:6px;overflow:hidden}
.t-bar i{display:block;height:100%;background:var(--yellow);width:0}
.t-btns{display:flex;gap:6px}
.t-btns button{appearance:none;border:1px solid color-mix(in srgb,currentColor 35%,transparent);background:transparent;color:inherit;border-radius:10px;min-height:44px;min-width:44px;padding:0 8px;font-size:15px;font-weight:600;cursor:pointer}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:10px 16px;font-size:14.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.22);max-width:calc(100% - 32px);text-align:center}
.timer:not([hidden]) ~ .toast{bottom:calc(158px + env(safe-area-inset-bottom,0px))}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font-size:11.5px;font-weight:500;color:var(--ink-3);cursor:pointer;min-height:60px;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.3}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* plan */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:14px}
.seg button{appearance:none;border:0;border-radius:10px;background:transparent;min-height:58px;font:800 28px/1 var(--f-display);color:var(--ink-2);cursor:pointer;padding:6px 2px}
.seg button small{display:block;font:500 11.5px/1.2 var(--f-body);margin-top:3px;letter-spacing:.01em}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.plan-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.plan-item:first-child{padding-top:2px}
.plan-item:last-child{border-bottom:0;padding-bottom:2px}
.pi-name{font-weight:600}
.pi-sub{font-size:13.5px;color:var(--ink-2)}
.state{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;display:inline-block}
.state.done{background:var(--good-bg);color:var(--good-ink)}
.state.next{background:var(--yellow);color:var(--on-yellow)}
.pi-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rules{margin:0;padding-left:18px}
.rules li{margin-bottom:4px}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:118px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:min(24px,70%);background:var(--series);border-radius:4px 4px 0 0;min-height:2px}
.bar.cur i{background:var(--ink)}
.bar b{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.bar span{font-size:11px;color:var(--ink-3);white-space:nowrap}
details.prog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.prog summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
details.prog summary::-webkit-details-marker{display:none}
details.prog ol{margin:0 0 12px;padding-left:22px;font-size:14.5px}
details.prog li{margin-bottom:5px}
.prog-list{display:flex;flex-direction:column;gap:8px}

/* stats and charts */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tl{font-size:12px;color:var(--ink-3);font-weight:500;line-height:1.25}
.tv{font-size:24px;font-weight:600;line-height:1.2;margin-top:3px}
.tv small{font-size:13px;font-weight:500;color:var(--ink-2)}
.td{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.chart{position:relative;width:100%;min-height:40px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-size:11.5px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--series);stroke:var(--surface);stroke-width:2}
.chart .dt2{fill:var(--series-2);stroke:var(--surface);stroke-width:1.5}
.chart .band{fill:var(--band)}
.chart .band-t{fill:var(--band-ink);font-size:11.5px;font-family:var(--f-body)}
.chart .cross{stroke:var(--line-strong);stroke-width:1}

<div class="card lead"><p><b>Plan u jednoj rečenici:</b> 12 nedelja lagane definicije, gornji deo tri puta nedeljno i noge jednom, sve se beleži, protein u svakom obroku i kreatin svaki dan.</p>
<p class="muted small">Tri stvari koje popravljamo: umesto „sve pomalo“ imaš jasan cilj, trening ide po redu bez obzira na dan u nedelji, a kilaža raste po pravilu, ne po osećaju.</p></div>
<details open><summary>Cilj za 12 nedelja</summary><div class="body"><ul>
<li>Težina 76–78 kg, struk 4–5 cm manji.</li><li>Kosi bench isti ili jači, zgibovi sa težim tegom, nožni potisak raste skoro svake nedelje.</li>

/* ---------- backup and restore ---------- */
async function saveFile(name, text, mime) {
  const blob = new Blob([text], {type: mime});
  try {
    const file = new File([blob], name, {type: mime});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], title: name}); return 'shared'; }
      catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
    }
  } catch (e) {}
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
  return 'downloaded';
}
async function doBackup() {

  const r = await saveFile(`gvozdeni-dnevnik-kopija-${todayISO()}.json`, JSON.stringify(data), 'application/json');
  if (r === 'cancel') return;
  LS.set(K_BACKUP, new Date().toISOString());
  setSync(); renderNapredak(true);

/* ---------- rest timer, sound, wake lock ---------- */
const TM = {end: 0, total: 0, iv: null, done: false, hideT: null};

function unlockAudio() {

    if (AC && AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function beep() {
  try {
    if (!AC) return;

      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = 880;

      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.2);

}

}
function tickT() {

/* ---------- charts ---------- */
function niceTicks(min, max, n) {
  if (!(max > min)) { min -= 1; max += 1; }
  const rw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(rw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= rw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
function drawChart(host, cfg) {
  if (!host) return;
  const all = cfg.line.concat(cfg.dots || []);
  if (!all.length) { host.innerHTML = `<p class="empty">${esc(cfg.empty)}</p>`; return; }
  const W = Math.max(260, Math.round(host.getBoundingClientRect().width || 320));
  const Hh = 210, mL = 42, mR = cfg.endLabel ? 50 : 14, mT = 14, mB = 26;
  const dT = all.map(p => p.t);
  const dMin = Math.min.apply(null, dT), dMax = Math.max.apply(null, dT);
  let t0 = dMin, t1 = dMax;
  if (t1 - t0 < 864e5) { t0 -= 3 * 864e5; t1 += 3 * 864e5; }
  let v0 = Math.min.apply(null, all.map(p => p.y)), v1 = Math.max.apply(null, all.map(p => p.y));
  if (cfg.band) { v0 = Math.min(v0, cfg.band.lo); v1 = Math.max(v1, cfg.band.hi); }
  const ticks = niceTicks(v0, v1, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = x => mL + (x - t0) / (t1 - t0) * (W - mL - mR);
  const Y = v => mT + (1 - (v - y0) / (y1 - y0)) * (Hh - mT - mB);
  let s = `<svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" tabindex="0" aria-label="${esc(cfg.aria)}">`;
  if (cfg.band) {
    const yb = Y(cfg.band.hi), hb = Y(cfg.band.lo) - yb;
    s += `<rect class="band" x="${mL}" y="${yb.toFixed(1)}" width="${W - mL - mR}" height="${Math.max(1, hb).toFixed(1)}"/>`;
    s += `<text class="band-t" x="${mL + 6}" y="${(yb + Math.min(hb, 26) / 2 + 4).toFixed(1)}">${esc(cfg.band.label)}</text>`;
  }
  ticks.forEach(v => { const y = Y(v).toFixed(1); s += `<line class="gl" x1="${mL}" x2="${W - mR}" y1="${y}" y2="${y}"/><text class="ax" x="${mL - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${esc(cfg.fmtY(v))}</text>`; });
  const lt = ((cfg.dots && cfg.dots.length) ? cfg.dots : cfg.line).map(p => p.t);
  const lMin = Math.min.apply(null, lt), lMax = Math.max.apply(null, lt);
  const xl = [lMin]; if (lMax - lMin >= 864e5) xl.push(lMax);
  xl.forEach((x, i) => { const anchor = xl.length === 1 ? 'middle' : (i === 0 ? 'start' : 'end'); s += `<text class="ax" x="${X(x).toFixed(1)}" y="${Hh - 6}" text-anchor="${anchor}">${esc(fmtD(isoOf(new Date(x))))}</text>`; });
  (cfg.dots || []).forEach(p => { s += `<circle class="dt2" cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5"/>`; });
  if (cfg.line.length > 1) s += `<path class="ln" d="${cfg.line.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ')}"/>`;
  const r = cfg.line.length > 30 ? 3 : 4;
  cfg.line.forEach(p => { s += `<circle class="dt" cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${r}"/>`; });
  if (cfg.endLabel && cfg.line.length) { const p = cfg.line[cfg.line.length - 1]; s += `<text class="endl" x="${(X(p.t) + 8).toFixed(1)}" y="${(Y(p.y) + 4).toFixed(1)}">${esc(cfg.fmtEnd(p.y))}</text>`; }
  s += `<line class="cross" x1="0" x2="0" y1="${mT}" y2="${Hh - mB}" visibility="hidden"/><circle class="hl" r="6" cx="0" cy="0" visibility="hidden"/>`;
  s += `<rect x="${mL}" y="0" width="${W - mL - mR}" height="${Hh}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  host.innerHTML = s;
  const svg = $('svg', host), tip = $('.tip', host), cross = $('.cross', svg), hl = $('.hl', svg);
  const hp = cfg.hover; let idx = -1;
  if (!hp.length) return;
  function show(i) {
    idx = i; const p = hp[i], x = X(p.t), y = Y(p.y);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
    hl.setAttribute('cx', x); hl.setAttribute('cy', y); hl.setAttribute('visibility', 'visible');
    tip.innerHTML = p.tip; tip.hidden = false;
    const sc = host.clientWidth / W, tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp(x * sc, tw / 2 + 2, host.clientWidth - tw / 2 - 2) + 'px';
    tip.style.top = Math.max(y * sc - 10, th + 2) + 'px';
  }
  function hide() { idx = -1; cross.setAttribute('visibility', 'hidden'); hl.setAttribute('visibility', 'hidden'); tip.hidden = true; }
  function nearest(cx) {
    const rc = svg.getBoundingClientRect(), x = (cx - rc.left) * (W / rc.width);
    let bi = 0, bd = Infinity;
    hp.forEach((p, i) => { const dd = Math.abs(X(p.t) - x); if (dd < bd) { bd = dd; bi = i; } });
    return bi;
  }
  svg.addEventListener('pointermove', e => show(nearest(e.clientX)));
  svg.addEventListener('pointerdown', e => show(nearest(e.clientX)));
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); show(idx < 0 ? hp.length - 1 : clamp(idx + (e.key === 'ArrowRight' ? 1 : -1), 0, hp.length - 1)); }
    else if (e.key === 'Escape') hide();
  });
}

function orderedExercises() {

function prevEntryFor(exId, s) {
  for (const x of S.desc) {
    if (x.id === s.id || x.date > s.date) continue;
    if (x.date === s.date && (x.created || '') >= (s.created || '')) continue;
    const e = (x.entries || []).find(y => y.ex === exId);
    if (e && e.sets && e.sets.length) return {s: x, e};
  }
  return null;
}
const topKg = sets => Math.max.apply(null, sets.map(st => st.kg || 0));
const repsAt = (sets, kg) => sets.filter(st => (st.kg || 0) === kg).reduce((a, st) => a + st.r, 0);
const sumReps = sets => sets.reduce((a, st) => a + st.r, 0);
const liHTML = (arr, cls) => arr.length ? `<ul${cls ? ` class="${cls}"` : ''}>${arr.map(x => `<li>${x}</li>`).join('')}</ul>` : '';
const secHTML = k => `<div class="sec">${te(k)}</div>`;
function listNames(arr, max) { const m = max || 6; return arr.length > m ? arr.slice(0, m).join(' · ') + ' · …' : arr.join(' · '); }

function reportPost(id, opts) {
  opts = opts || {};
  const s = S.sessions.find(x => x.id === id); if (!s) return '';
  const planned = plannedOf(s), range = {};
  planned.forEach(([ex, n, lo, hi]) => { range[ex] = {n, lo, hi}; });
  const good = [], bad = [], next = [], firsts = [];
  const prs = findPRs(s, s.id), prSet = new Set(prs.map(p => p.ex));
  prs.forEach(p => good.push(te('r_pr', {ex: exName(p.ex), s: p.txt})));
  let sameCount = 0;
  for (const e of s.entries || []) {
    const ex = EX[e.ex]; if (!ex || !e.sets || !e.sets.length) continue;
    const rg = range[e.ex] || {n: e.sets.length, lo: ex.def[1], hi: ex.def[2]};
    const nm = exName(e.ex);
    const pv = prevEntryFor(e.ex, s);
    let flagged = false;
    if (!pv) firsts.push(nm);
    else if (ex.mode === 'r') {
      const a = sumReps(e.sets), b = sumReps(pv.e.sets);
      if (a > b && !prSet.has(e.ex)) good.push(te('r_upr_r', {ex: nm, n: npl(a - b, 'rep')}));
      else if (b - a >= 2) { bad.push(te('r_down', {ex: nm, n: npl(b - a, 'rep')})); flagged = true; }
    } else {
      const tk = topKg(e.sets), pk = topKg(pv.e.sets);
      if (tk > pk + 1e-9) { if (!prSet.has(e.ex)) good.push(te('r_upw', {ex: nm, a: fmtKg(pk), b: fmtKg(tk)})); }
      else if (tk < pk - 1e-9) {
        const was = suggest(e.ex, rg.n, rg.lo, rg.hi, s.date, s.id);
        if (was.kind !== 'down') { bad.push(te('r_lighter', {ex: nm})); flagged = true; }
      } else {
        const a = repsAt(e.sets, tk), b = repsAt(pv.e.sets, pk);
        if (a > b && !prSet.has(e.ex)) good.push(te('r_upr', {ex: nm, n: npl(a - b, 'rep')}));
        else if (b - a >= 2) { bad.push(te('r_down', {ex: nm, n: npl(b - a, 'rep')})); flagged = true; }
      }
    }
    if (!flagged && ex.mode !== 'r' && !(ex.mode === 'bw' && !e.sets[0].kg) && e.sets[0].r < rg.lo) bad.push(te('r_below', {ex: nm}));
    const sg = suggest(e.ex, rg.n, rg.lo, rg.hi, s.date, null);
    if (sg.kind === 'up' && sg.kg != null) next.push(te('r_ready', {ex: nm, kg: (ex.mode === 'bw' ? '+' : '') + fmtKg(sg.kg)}));
    else if (sg.kind === 'down') next.push(te('r_next_down', {ex: nm, kg: fmtKg(sg.kg)}));
    else sameCount++;
  }
  const done = new Set((s.entries || []).map(e => e.ex));
  const skipped = planned.filter(it => !done.has(it[0])).map(it => exName(it[0]));
  if (skipped.length) bad.push(te('r_skipped', {l: listNames(skipped)}));
  if (sameCount) next.push(te('r_next_same'));
  const nSets = (s.entries || []).reduce((a, e) => a + e.sets.length, 0);
  let vol = '';
  const prevSame = S.desc.find(x => x.id !== s.id && x.day === s.day && (x.date < s.date || (x.date === s.date && (x.created || '') < (s.created || ''))));
  if (prevSame) {
    let v1 = 0, v0 = 0, common = 0;
    (s.entries || []).forEach(e => {
      if (!EX[e.ex] || EX[e.ex].mode !== 'w') return;
      const pe = (prevSame.entries || []).find(x => x.ex === e.ex); if (!pe) return;
      common++;
      v1 += e.sets.reduce((a, st) => a + (st.kg || 0) * st.r, 0);
      v0 += pe.sets.reduce((a, st) => a + (st.kg || 0) * st.r, 0);

    if (common >= 2 && v0 > 0) vol = te('r_vol', {p: fmtPct((v1 - v0) / v0 * 100), k: s.day});

  let h = '<div class="report">';
  if (!opts.noTitle) h += `<h4>${te('r_post_title', {k: s.day, n: dayName(s.day), d: fmtDW(s.date)})}</h4>`;
  h += `<p>${te('r_summary', {n: npl(nSets, 'set'), dur: s.dur ? t('r_dur', {m: s.dur}) : ''})}${vol}${firsts.length ? ' ' + te('r_first', {l: listNames(firsts)}) : ''}</p>`;
  if (good.length) h += secHTML('r_good') + liHTML(good, 'good');
  h += secHTML('r_bad') + (bad.length ? liHTML(bad, 'bad') : `<p>${te('r_nothing_bad')}</p>`);
  if (next.length) h += secHTML('r_next') + liHTML(next);
  h += `<p class="coachline">${te(cl)}</p></div>`;
  return h;
}

function stalled(exId, upto) {
  const h = histFor(exId, upto, null).slice(0, 3);
  if (h.length < 3) return false;
  const m = h.map(x => { const b = best(exId, x.sets, x.date); return b ? b.m : null; });
  if (m.some(v => v == null)) return false;
  return m[0] <= m[2] + 1e-6 && m[1] <= m[2] + 1e-6;
}
function exTrend(exId, from, to) {
  /* best in [from, to] vs the last session before from (or the first one inside) */
  const inside = S.asc.filter(s => s.date >= from && s.date <= to).map(s => ({s, e: (s.entries || []).find(x => x.ex === exId)})).filter(o => o.e && o.e.sets.length);
  if (!inside.length) return null;
  const before = histFor(exId, addDays(from, -1), null)[0];
  const startM = before ? best(exId, before.sets, before.date) : best(exId, inside[0].e.sets, inside[0].s.date);
  const lastO = inside[inside.length - 1], endM = best(exId, lastO.e.sets, lastO.s.date);
  if (!startM || !endM || (!before && inside.length < 2)) return null;
  return {a: startM.m, b: endM.m, p: (endM.m - startM.m) / startM.m * 100, n: inside.length};
}

function reportWeek(wk) {
  const we = addDays(wk, 6), isCur = weekStart(todayISO()) === wk;
  const ss = S.asc.filter(s => s.date >= wk && s.date <= we);
  const ctx = weekCtx(wk);
  let h = `<div class="report"><h4>${te('weekly_report')}</h4><p class="muted small">${te('r_week_title', {a: fmtD(wk), b: fmtD(we)})}${isCur ? ' · ' + te('r_week_now') : ''}</p>`;
  h += `<p>${te('r_sessions', {d: ss.length, p: ctx.plan.length})}.${ss.length ? ' ' + te('r_list', {l: ss.map(s => s.day).join(', ')}) + '.' : ''}</p>`;
  const plannedSets = {}, doneSets = {};
  ctx.plan.forEach(k => {
    const sess = ss.find(s => s.day === k);
    (sess ? plannedOf(sess) : planItems(k)).forEach(([ex, n]) => { const g = EX[ex].g; plannedSets[g] = (plannedSets[g] || 0) + n; });
  });
  ss.forEach(s => (s.entries || []).forEach(e => { if (!EX[e.ex]) return; const g = EX[e.ex].g; doneSets[g] = (doneSets[g] || 0) + e.sets.length; }));
  const gs = GROUPS.filter(g => plannedSets[g] || doneSets[g]);
  if (gs.length && ss.length) {
    h += secHTML('r_groups');
    h += `<div class="gbars">${gs.map(g => { const d = doneSets[g] || 0, pl = plannedSets[g] || 0, pc = pl ? Math.min(100, Math.round(d / pl * 100)) : 100; return `<div class="gb${pl && d < pl * 0.6 && !isCur ? ' low' : ''}"><span>${esc(gName(g))}</span><b>${d}/${pl}</b><span class="gbar"><i style="width:${pc}%"></i></span></div>`; }).join('')}</div>`;
  }
  const good = [], bad = [], next = [];
  const prEx = [];
  ss.forEach(s => findPRs(s, s.id).forEach(p => { const nm = exName(p.ex); if (!prEx.includes(nm)) prEx.push(nm); }));
  if (prEx.length) good.push(te('r_prs', {l: listNames(prEx, 4)}));
  const exs = []; ss.forEach(s => (s.entries || []).forEach(e => { if (EX[e.ex] && !exs.includes(e.ex)) exs.push(e.ex); }));
  let up = 0, down = 0;
  const downNames = [];
  exs.forEach(ex => { const tr = exTrend(ex, wk, we); if (!tr) return; if (tr.p > 0.5) up++; else if (tr.p < -3) { down++; downNames.push(exName(ex)); } });
  if (up) good.push(te('r_prog_up', {a: npl(up, 'exl')}));
  const left = ctx.plan.filter(k => !ctx.done.has(k)).map(dayLabel);
  if (left.length) (isCur ? next : bad).push(te(isCur ? 'r_left' : 'r_missed', isCur ? {l: left.join(', ')} : {n: npl(left.length, 'wo')}));
  else if (ctx.plan.length) good.push(te('r_all_done'));
  if (ctx.skipped.length) bad.push(te('r_skipped_w', {l: ctx.skipped.map(dayLabel).join(', ')}));
  if (!isCur) { const low = gs.filter(g => (plannedSets[g] || 0) >= 4 && (doneSets[g] || 0) < plannedSets[g] * 0.6).map(gName); if (low.length && ss.length) bad.push(te('r_low_groups', {l: low.join(', ')})); }
  const st = exs.filter(ex => stalled(ex, we)).map(exName);
  if (st.length) bad.push(te('r_stall', {l: listNames(st, 4)}));
  if (downNames.length) bad.push(te('r_m_decl', {l: listNames(downNames, 4)}));
  const ready = [];
  const nc = weekCtx(todayISO()), leftNow = nc.plan.filter(k => !nc.done.has(k));
  (leftNow.length ? leftNow : nc.plan).forEach(k => planItems(k).forEach(([ex, n, lo, hi]) => { if (ready.includes(exName(ex))) return; const sg = suggest(ex, n, lo, hi, todayISO(), null); if (sg.kind === 'up' && sg.kg != null) ready.push(exName(ex)); }));
  if (ready.length) next.push(te('r_add_next2', {l: listNames(ready)}));
  const db = daysSinceBackup();
  if (S.sessions.length && (db == null || db > 7)) next.push(te('r_backup'));
  if (good.length) h += secHTML('r_good') + liHTML(good, 'good');
  if (bad.length) h += secHTML('r_bad') + liHTML(bad, 'bad');
  if (next.length) h += secHTML('r_next') + liHTML(next);
  const wb = weeklyBody(), bw = wb.find(w => w.wk === wk);
  if (bw) {
    const i = wb.indexOf(bw), pw = i > 0 ? wb[i - 1] : null;
    h += `<p>${pw ? te('r_body', {a: fmt1(bw.avg), c: fmtSigned(bw.avg - pw.avg)}) : te('r_body1', {a: fmt1(bw.avg)})}${bw.waist != null ? ' ' + te('r_waist', {a: fmtKg(bw.waist)}) : ''}</p>`;
  }
  if (!isCur) {
    const ratio = ss.length / Math.max(1, ctx.plan.length);
    const cl = ratio >= 1 && (prEx.length || up > down) ? 'wk_great' : ratio >= 0.75 ? 'wk_good' : ratio >= 0.5 ? 'wk_meh' : 'wk_few';
    h += `<p class="coachline">${te(cl)}</p>`;
  }

}

function reportMonth(ym) {
  const p = ym.split('-').map(Number);
  const first = ym + '-01', last = isoOf(new Date(p[0], p[1], 0));
  const isCur = todayISO().slice(0, 7) === ym;
  const end = isCur ? todayISO() : last;
  const ss = S.asc.filter(s => s.date >= first && s.date <= last);
  if (!ss.length) return null;
  const startAct = S.asc.length ? weekStart(S.asc[0].date) : first;
  const from = startAct > first ? startAct : first;
  const days = daysBetween(from, end) + 1, weeks = days / 7;
  let expected = 0;
  for (let d = from; d <= end; d = addDays(d, 1)) expected += weekCtx(d).plan.length / 7;
  const pct = expected > 0 ? Math.round(ss.length / expected * 100) + '%' : '–';
  let h = `<div class="report"><h4>${te('monthly_report')}</h4><p class="muted small">${esc(fmtMonth(ym))}${isCur ? ' · ' + esc(fmtD(first)) + ' – ' + esc(fmtD(end)) : ''}</p>`;
  h += `<p>${te('r_m_sessions', {n: ss.length, a: fmt1(ss.length / Math.max(1, weeks)), p: pct})}</p>`;
  const exs = []; ss.forEach(s => (s.entries || []).forEach(e => { if (EX[e.ex] && !exs.includes(e.ex)) exs.push(e.ex); }));
  const trends = exs.map(ex => ({ex, tr: exTrend(ex, first, end)})).filter(o => o.tr);
  const gains = trends.filter(o => o.tr.p > 0.5).sort((a, b) => (EX[b.ex].big ? 1 : 0) - (EX[a.ex].big ? 1 : 0) || b.tr.p - a.tr.p);
  const decl = trends.filter(o => o.tr.p < -3);
  const fmtTr = o => EX[o.ex].mode === 'r'
    ? te('r_m_reps', {ex: exName(o.ex), a: Math.round(o.tr.a), b: Math.round(o.tr.b), p: fmtPct(o.tr.p)})
    : te('r_m_gain', {ex: exName(o.ex), a: fmtKg(Math.round(o.tr.a)), b: fmtKg(Math.round(o.tr.b)), p: fmtPct(o.tr.p)});
  h += secHTML('r_m_strength2');
  if (!trends.length) h += `<p>${te('r_m_none')}</p>`;
  else {
    if (gains.length) h += liHTML(gains.slice(0, 6).map(fmtTr), 'good');
    if (decl.length) h += liHTML(decl.slice(0, 4).map(fmtTr), 'bad');
    if (!gains.length && !decl.length) h += `<p>${te('r_m_v_hold')}</p>`;
  }
  const wb = weeklyBody().filter(w => w.wk >= weekStart(first) && w.wk <= end);
  let bodyDown = false;
  const bodyLines = [];
  if (wb.length) {
    const a = wb[0].avg, b = wb[wb.length - 1].avg;
    bodyDown = b < a - 0.3;
    if (wb.length > 1) bodyLines.push(te('r_m_body', {a: fmt1(a), b: fmt1(b), c: fmtSigned(b - a)}));
    else bodyLines.push(te('r_body1', {a: fmt1(a)}));
    const ws = S.bodyAsc.filter(x => x.date >= first && x.date <= end && typeof x.waist === 'number');
    if (ws.length > 1) bodyLines.push(te('r_m_waist', {a: fmtKg(ws[0].waist), b: fmtKg(ws[ws.length - 1].waist)}));
    const pr = profile(), wkN = Math.max(1, daysBetween(wb[0].wk, wb[wb.length - 1].wk) / 7);
    const rate = wb.length > 1 ? (b - a) / wkN : 0;
    if (rate < -0.05 && b > pr.goalMax) bodyLines.push(te('r_m_eta', {n: npl(Math.ceil((b - pr.goalMax) / -rate), 'week')}));
  }
  if (bodyLines.length) h += secHTML('body_word') + liHTML(bodyLines);
  const bwk = blockWeek();
  h += `<p>${bwk > 12 ? te('r_m_block_done') : te('r_m_block', {n: bwk})}</p>`;
  let v;
  if (!isCur && ss.length < 6) v = 'r_m_v_few';
  else if (gains.length > decl.length && bodyDown) v = 'r_m_v_great';
  else if (decl.length > gains.length) v = 'r_m_v_drop';
  else if (bodyDown) v = 'r_m_v_hold';
  else v = 'r_m_v_ok';
  h += `<p class="coachline">${te(v)}</p></div>`;
  return h;
}

function prevMonth() { const d = new Date(); return isoOf(new Date(d.getFullYear(), d.getMonth() - 1, 1)).slice(0, 7); }

function autoReports() {

  return run('rm', {day: day || cur.day, g});
}
function handleText(raw) {
  const text = String(raw || '').trim(); if (!text) return;
  userSay(text);
  const n = norm(text);
  if (RX.undo.test(n)) return run('undo', {});
  if (RX.help.test(n)) return run('help', {});
  const verb = RX.rm.test(n) || RX.skip.test(n) || RX.add.test(n) || RX.swap.test(n);
  if (RX.lang.test(n) && n.split(' ').length <= 5) { setLang(/\b(engleski|english)\b/.test(n) ? 'en' : 'sr'); return say(te('lang_set')); }
  if (RX.reset.test(n) && !RX.add.test(n)) return run('reset', {});
  if (verb) return planCommand(text, n);
  if (RX.month.test(n) && (RX.report.test(n) || n.split(' ').length <= 3)) return run('rep_month', {});
  if (RX.week.test(n) && (RX.report.test(n) || n.split(' ').length <= 3)) return run('rep_week', {});
  if (RX.report.test(n) || (RX.last.test(n) && RX.workout.test(n))) return run('rep_last', {});
  if (SET.ai.key) return askAI();
  say(te(n.split(' ').length > 3 ? 'ai_off_short' : 'not_understood'), quickActs());
}
function quickActs() { return [act(t('c_rm'), 'rm', {}), act(t('c_add'), 'add', {}), act(t('c_swap'), 'sw', {}), act(t('c_week'), 'rep_week', {}), act(t('c_help'), 'help', {})]; }

/* ---------- optional AI (Claude API, his own key) ---------- */
function mdToHTML(src) {
  const lines = String(src).replace(/\r/g, '').split('\n');
  let h = '', list = null;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<b>$1</b>');
  const close = () => { if (list) { h += `</${list}>`; list = null; } };
  lines.forEach(line => {
    const l = line.trim(); let m;
    if (!l) { close(); return; }
    if ((m = l.match(/^[-*•]\s+(.*)$/))) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += `<li>${inline(m[1])}</li>`; return; }
    if ((m = l.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += `<li>${inline(m[1])}</li>`; return; }
    close();
    h += `<p>${inline(l.replace(/^#{1,6}\s+/, ''))}</p>`;
  });
  close();
  return h || '<p></p>';
}
function aiSystem() {
  const today = todayISO(), ctx = weekCtx(today), en = L() === 'en';
  const out = [];
  out.push('You are the personal trainer inside "Gvozdeni dnevnik", a workout log app on the user\'s phone. Talk like an experienced, warm and direct coach who knows his numbers.');
  out.push(en ? 'Reply in English.' : 'Reply in Serbian, Latin script, ekavian, informal "ti". Use natural, everyday gym Serbian.');
  out.push('Keep answers short and practical for a phone screen: 2 to 6 sentences or a few bullets. No tables and no headings. Use **bold** sparingly. Use his real numbers from the data below when they help.');
  out.push('Program rules: a 12-week gentle cut toward 76–78 kg body weight, then a muscle-gain plan. Double progression: when every set reaches the top of the rep range with clean form, add weight next time and restart at the bottom of the range (barbell +2.5 kg, dumbbells +1–2 kg, cables +2.5 kg, machines and legs +5 kg). Big lifts stop 1–2 reps before failure; machines and isolation take the last set to failure; workout E and back extensions never go to failure. Rest 2–3 min on big lifts, 1–2 min on the rest.');
  out.push('He does not squat or deadlift because he does not tolerate them; legs are trained once a week on machines only, never twice in a week. A normal week is A→B→C→D; a 3-workout week is G1→C→G2; a fifth day is E; F is a 45-minute full body stand-in.');
  out.push('Nutrition basics: about 150 g protein a day spread over meals, liquid calories at zero, alcohol at most once a week, 8,000–10,000 steps, weigh-ins 3–4 mornings a week judged by the weekly average with a target of −0.3 to −0.5 kg a week. Creatine monohydrate 5 g daily. Water 2.5–3 L, only sips in the last 2–3 hours before bed.');
  out.push('You cannot change the plan yourself. If he wants to remove, add or replace an exercise, or skip or replace a workout this week, tell him to type a command such as ' + (en ? '"remove face pull", "add a biceps exercise" or "replace workout"' : '„izbaci face pull“, „ubaci vežbu za biceps“ ili „zameni trening“') + ', or to use the buttons above the message box.');
  out.push('Never diagnose. For sharp, joint or lasting pain, tell him to stop that exercise and see a doctor or physiotherapist. Do not suggest drugs, SARMs or prohormones.');
  if (SET.ai.about.trim()) out.push('About him, in his own words: ' + SET.ai.about.trim().slice(0, 1500));
  out.push('Today is ' + today + ', week ' + blockWeek() + ' of the 12-week block.');
  out.push('Current plan (sets × rep range):\n' + ORDER.map(k => `${k} ${DAYS[k].name.en}${isCustom(k) ? ' (changed by him)' : ''}: ` + planItems(k).map(([e, nn, lo, hi]) => `${exName(e)} ${nn}×${lo}-${hi}`).join('; ')).join('\n'));
  out.push(`This week: ${ctx.type} workouts planned (${ctx.plan.join(', ')}); done: ${[...ctx.done].join(', ') || 'none'}; next: ${ctx.next || 'none'}` + (ctx.skipped.length ? `; skipped: ${ctx.skipped.join(', ')}` : '') + (Object.keys(ctx.origin).length ? '; replaced: ' + Object.keys(ctx.origin).map(k => `${ctx.origin[k]}→${k}`).join(', ') : '') + '.');
  const rec = S.desc.slice(0, 8).map(s => `${s.date} ${s.day}${s.dur ? ' (' + s.dur + ' min)' : ''}: ` + (s.entries || []).map(e => `${exName(e.ex)} ${EX[e.ex] ? fmtSets(e.ex, e.sets) : ''}`).join('; ') + (s.note ? ` | his note: ${s.note}` : ''));
  out.push(rec.length ? 'Recent workouts, newest first:\n' + rec.join('\n') : 'No workouts logged yet.');
  const wb = weeklyBody().slice(-6).map(w => `week of ${w.wk}: ${w.avg.toFixed(1)} kg average of ${w.n} weigh-ins${w.waist != null ? ', waist ' + w.waist + ' cm' : ''}`);
  if (wb.length) out.push('Body weight:\n' + wb.join('\n'));
  return out.join('\n\n');
}
function aiMessages() {
  const msgs = [];
  CHAT.slice(-14).forEach(m => {
    let text = htmlText(m.h); if (!text) return;
    if (text.length > 1500) text = text.slice(0, 1500) + '…';
    const role = m.r === 'u' ? 'user' : 'assistant', lastM = msgs[msgs.length - 1];
    if (lastM && lastM.role === role) lastM.content += '\n\n' + text; else msgs.push({role, content: text});
  });
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  return msgs;
}
async function askAI() {
  if (AI_BUSY) return;
  const msgs = aiMessages();
  if (!msgs.length || msgs[msgs.length - 1].role !== 'user') return;
  AI_BUSY = true; renderChat(); scrollChat();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'x-api-key': SET.ai.key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: SET.ai.model, max_tokens: 800, system: aiSystem(), messages: msgs}),
    });
    let j = null; try { j = await res.json(); } catch (e) { j = null; }
    AI_BUSY = false;
    if (!res.ok) {
      const msg = j && j.error && j.error.message ? String(j.error.message) : 'HTTP ' + res.status;
      if (res.status === 401 || res.status === 403) say(te('ai_err_401'));
      else if (res.status === 429 || res.status === 529 || /credit|billing|balance/i.test(msg)) say(te('ai_err_429'));
      else say(te('ai_err', {m: msg.slice(0, 200)}));
    } else {
      const txt = (j && Array.isArray(j.content) ? j.content : []).filter(b => b && b.type === 'text').map(b => b.text).join('\n\n').trim();
      say(txt ? mdToHTML(txt) : te('ai_err', {m: '—'}), [], 'ai');
    }
  } catch (e) { AI_BUSY = false; say(te('ai_err_net')); }
  AI_BUSY = false; renderChat();
}

}
const pC = $('#p-trener');
